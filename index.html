<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boba Toppings</title>
    <link rel="stylesheet" href="style.css">
    <style>  
        .hero{
            display: flex;
            height: 50vh;
            padding: 100px;
            background-color: wheat;
            border-radius: 15px;
            margin: 20px;
            gap: 40px;
        }
        .container{
            display: flex;
            width: 50%;
            height: 100%;
        }
        .bobaimg{
            width: 300px;
            height: 400px;
        }
        .second{
            display: flex;
            flex-direction: column;
            height: 100%;
            background-color: rgb(255, 214, 138);
            padding: 20px;
            border-radius: 15px;
        }
        .second h1{
            font-size: 50px;
            color: rgb(255, 0, 0);
            margin: 20px;
        }

        .second p{
            font-size: 30px;
            color: rgb(0, 0, 0);
        }

        .cool{
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .cool h1{
            font-size: 50px;
            color: white;
            margin: 20px;
        }
        .items{
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;

        }
        .item img{
            width: 300px;
            height: 400px;
            animation: move 4s infinite ease-in-out;
        }
        
        @keyframes move{
            0%{
                transform: rotateZ(0deg);
            }
            33%{
                transform: rotateZ(5deg);
            }
            66%{
                transform: rotateZ(-5deg);
            }
            100%{
                transform: rotateZ(0deg);
            }
        }

        @media (max-width: 768px) {
            .bobaimg{
                width: 200px;
                height: 300px;
            }
            .second h1{
                font-size: 30px;
            }
            .second p{
                font-size: 16px;
            }
            .items{
                grid-template-columns: repeat(2, 1fr);
            }
            .item img{
                width: 200px;
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="container">
            <img src="aboutusimg2.png" alt="" class="bobaimg">
        </div>
        <div class="second">
            <h1>BOBBA TEA</h1>
            <p>Boba tea is a Taiwanese drink that feels smooth and refreshing to drink. You can eat the boba tea too! You can eat the ball of boba tea called BOBA BALLS!</p>
        </div>
    </div>

    <div class="cool">
        <h1>COOL BOBBA FLAVORS</h1>
        <div class="items">
            <div class="item">
                <img src="img/bobba-naturel-CA-fraise.png" alt="">
            </div>
            <div class="item">
                <img src="img/bobba-naturel-CA-limonade-fruit-du-dragon.png" alt="">
            </div>
            <div class="item">
                <img src="img/bobba-naturel-CA-limonade-mangue.png" alt="">
            </div>
            <div class="item">
                <img src="img/bobba-naturel-CA-melondeau.png" alt="">
            </div>
            
        </div>
    </div>
</body>
</html>
